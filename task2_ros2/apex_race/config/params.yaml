# Every tunable value for Apex lives here.
# Each node and script reads its own section.

race_controller_node:
  ros__parameters:
    use_sim_time: true
    circuit_file: ""              # empty means the installed config/circuit.yaml
    car: auto                     # namespace and grid slot of this car
    laps: 3
    control_rate: 10.0            # Hz
    status_rate: 1.0              # Hz, /apex/status
    countdown_s: 3.0
    # Pure pursuit
    lookahead: 0.45               # m
    v_max: 0.22                   # m/s, the Burger's real top speed
    v_min: 0.08                   # m/s
    curvature_gain: 0.6           # v = v_max / (1 + gain * |curvature|)
    w_max: 1.5                    # rad/s
    search_window: 40             # waypoints searched ahead for the nearest one
    # Obstacle handling from /scan
    corridor_half_width: 0.17     # m, half the Burger's width plus a margin
    avoid_distance: 0.6           # m, corridor hit closer than this: RACING to AVOID
    clear_distance: 0.8           # m, corridor empty this far: AVOID to RACING
    avoid_hold_s: 1.0             # s stopped in AVOID before REPLAN
    gap_ahead: 1.0                # m, scan points this far ahead count when comparing sides
    gap_cap: 1.0                  # m, a side with nothing in it counts as this much free space
    replan_clearance: 0.25        # m, from the obstacle's seen edge to the racer's centre line
    replan_offset_min: 0.30       # m, smallest sideways shift of the waypoints
    replan_offset_max: 0.38       # m, largest shift: keeps 0.13 m to the wall
    replan_offset_step: 0.04      # m, extra shift each time REPLAN restarts for the same obstacle
    replan_points: 22             # waypoints shifted (0.1 m apart), from the car's position
    replan_ramp: 3                # waypoints used to ramp the shift in and out
    replan_speed: 0.12            # m/s while in REPLAN
    replan_lookahead: 0.25        # m, shorter than lookahead so the racer reaches the shifted line sooner
    replan_stop_distance: 0.15    # m, REPLAN to AVOID only if something is this close
    replan_stop_half_width: 0.1   # m, half the Burger's width: the band checked in REPLAN
    min_lap_time: 20.0            # s, ignore finish line crossings closer than this

monitor_node:
  ros__parameters:
    use_sim_time: true
    runs_dir: ""                  # empty means task2_ros2/runs next to the package source
    car: auto
    contact_enter: 0.15           # m, lowest LiDAR range below this starts a contact
    contact_exit: 0.20            # m, the contact ends above this
    tick_rate: 5.0                # Hz, rows in ticks.csv

keyboard_node:
  ros__parameters:
    use_sim_time: false
    player: player                # namespace of the car driven with w a s d
    lin_step: 0.05                # m/s per key press
    ang_step: 0.3                 # rad/s per key press
    lin_max: 0.22
    ang_max: 1.5

drop_obstacle:
  ros__parameters:
    use_sim_time: true
    lap: 2                        # drop the cone during this lap
    trigger_x: 1.0                # once the racer passes this x on the front straight
    cone_x: 0.0                   # where the cone lands (back straight)
    cone_y: 1.3                   # 0.1 m toward the outer wall from the centre line
    drop_height: 0.25
